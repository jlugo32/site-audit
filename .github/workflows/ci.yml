name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils shellcheck

      - name: ShellCheck
        run: shellcheck --version && shellcheck -x site-audit tests/run.sh

      - name: Offline test suite
        run: bash tests/run.sh

      - name: CLI smoke (help / version)
        run: |
          ./site-audit --version
          ./site-audit --help >/dev/null
